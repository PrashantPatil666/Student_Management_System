<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create New Student</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body>
<div class="container mt-5 col-md-6 card p-4 shadow">
    <h2 class="text-center mb-4">Add New Student</h2>

    <!-- FIXED action mapping and object binding link -->
    <form th:action="@{/students}" th:object="${student}" method="POST">
        <div class="form-group">
            <label>First Name</label>
            <input type="text" th:field="*{firstName}" class="form-control" required/>
        </div>
        <div class="form-group">
            <label>Last Name</label>
            <input type="text" th:field="*{lastName}" class="form-control" required/>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" th:field="*{email}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit</button>
        <a th:href="@{/students}" class="btn btn-secondary btn-block">Cancel</a>
    </form>
</div>
</body>
</html>
